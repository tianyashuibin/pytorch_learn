<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title"><title id="title">一次训练迭代：清理梯度、前向、损失、反向和参数更新</title><rect width="960" height="230" rx="16" fill="#eff6ff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#52718c"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#18354d;font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#bdd0df;stroke-width:2}.line{fill:none;stroke:#52718c;stroke-width:2;marker-end:url(#arrow)}</style><rect class="box" x="30.0" y="70" width="156.0" height="90" rx="12"/><text x="108.0" y="107" text-anchor="middle">zero_grad</text><text class="small" x="108.0" y="138" text-anchor="middle">清理已有梯度</text><path class="line" d="M188.0 115 H206.0"/><rect class="box" x="210.0" y="70" width="156.0" height="90" rx="12"/><text x="288.0" y="107" text-anchor="middle">forward</text><text class="small" x="288.0" y="138" text-anchor="middle">计算预测</text><path class="line" d="M368.0 115 H386.0"/><rect class="box" x="390.0" y="70" width="156.0" height="90" rx="12"/><text x="468.0" y="107" text-anchor="middle">loss</text><text class="small" x="468.0" y="138" text-anchor="middle">度量错误</text><path class="line" d="M548.0 115 H566.0"/><rect class="box" x="570.0" y="70" width="156.0" height="90" rx="12"/><text x="648.0" y="107" text-anchor="middle">backward</text><text class="small" x="648.0" y="138" text-anchor="middle">计算梯度</text><path class="line" d="M728.0 115 H746.0"/><rect class="box" x="750.0" y="70" width="156.0" height="90" rx="12"/><text x="828.0" y="107" text-anchor="middle">step</text><text class="small" x="828.0" y="138" text-anchor="middle">更新参数</text></svg>
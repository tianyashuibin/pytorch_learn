<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">概念示意：训练损失下降，验证损失先下降再上升</title><rect width="960" height="390" rx="16" fill="#eff6ff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#52718c"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#18354d;font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#bdd0df;stroke-width:2}.line{fill:none;stroke:#52718c;stroke-width:2;marker-end:url(#arrow)}</style><path class="line" d="M95 35 V285 H890"/><text x="30" y="45">损失</text><text x="830" y="325">训练轮数</text><path d="M110 80 C200 175 320 220 460 245 S740 262 865 268" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M110 65 C240 160 340 210 450 210 S670 130 865 85" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="10 5"/><text x="680" y="248">训练损失（实线）</text><text x="650" y="65">验证损失（虚线）</text><path d="M450 215 V285" stroke="#8394a3" stroke-dasharray="5 5"/><text class="small" x="320" y="310">验证表现较好的区域</text><text class="small" x="95" y="365">概念示意图：不对应示例代码的实测结果。</text></svg>
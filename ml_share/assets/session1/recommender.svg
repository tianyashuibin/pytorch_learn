<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title"><title id="title">用户和物品 Embedding 与数值特征拼接后进入 MLP</title><rect width="960" height="310" rx="16" fill="#eff6ff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#52718c"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#18354d;font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#bdd0df;stroke-width:2}.line{fill:none;stroke:#52718c;stroke-width:2;marker-end:url(#arrow)}</style><rect class="box" x="30" y="30" width="220" height="65" rx="10"/><text x="140" y="57" text-anchor="middle">用户 ID → Embedding</text><text class="small" x="140" y="81" text-anchor="middle">[B] → [B, 8]</text><rect class="box" x="30" y="120" width="220" height="65" rx="10"/><text x="140" y="147" text-anchor="middle">物品 ID → Embedding</text><text class="small" x="140" y="171" text-anchor="middle">[B] → [B, 8]</text><rect class="box" x="30" y="210" width="220" height="65" rx="10"/><text x="140" y="249" text-anchor="middle">数值特征 [B, 3]</text><path class="line" d="M250 63 L325 150"/><path class="line" d="M250 153 H325"/><path class="line" d="M250 243 L325 160"/><rect class="box" x="330" y="115" width="150" height="80" rx="10"/><text x="405" y="147" text-anchor="middle">特征拼接</text><text class="small" x="405" y="176" text-anchor="middle">[B, 19]</text><path class="line" d="M480 155 H530"/><rect class="box" x="535" y="115" width="180" height="80" rx="10"/><text x="625" y="147" text-anchor="middle">Linear + ReLU</text><text class="small" x="625" y="176" text-anchor="middle">[B, 16]</text><path class="line" d="M715 155 H765"/><rect class="box" x="770" y="115" width="160" height="80" rx="10"/><text x="850" y="147" text-anchor="middle">Linear → logit</text><text class="small" x="850" y="176" text-anchor="middle">[B] → sigmoid</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title"><title id="title">梯度更新后预测由2变为3.5，向目标5靠近</title><rect width="960" height="250" rx="16" fill="#eff6ff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#52718c"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#18354d;font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#bdd0df;stroke-width:2}.line{fill:none;stroke:#52718c;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="45">单样本：x = 2，y = 5；学习率 η = 0.1</text><path class="line" d="M80 135 H880"/><g text-anchor="middle"><circle cx="340" cy="135" r="10" fill="#d97706"/><text x="340" y="104">更新前：ŷ = 2</text><circle cx="550" cy="135" r="10" fill="#2563eb"/><text x="550" y="180">更新后：ŷ = 3.5</text><circle cx="760" cy="135" r="10" fill="#059669"/><text x="760" y="104">目标：y = 5</text></g><text class="small" x="40" y="215">w：1 → 1.6　 b：0 → 0.3　 损失：4.5 → 1.125</text></svg>